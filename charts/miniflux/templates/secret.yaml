{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "miniflux.fullname" . }}
  labels:
    {{- include "miniflux.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "Set miniflux.databaseUrl, or point existingSecret at a Secret that already holds it." .Values.miniflux.databaseUrl | quote }}
  {{- if .Values.miniflux.createAdmin }}
  ADMIN_PASSWORD: {{ required "Set miniflux.adminPassword while miniflux.createAdmin is true, or point existingSecret at a Secret that already holds it." .Values.miniflux.adminPassword | quote }}
  {{- end }}
{{- end }}
