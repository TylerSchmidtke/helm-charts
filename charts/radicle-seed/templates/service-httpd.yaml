{{- if .Values.httpd.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "radicle-seed.fullname" . }}-httpd
  labels:
    {{- include "radicle-seed.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "radicle-seed.seedSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
{{- end }}
