{{- if .Values.explorer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "radicle-seed.fullname" . }}-explorer
  labels:
    {{- include "radicle-seed.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "radicle-seed.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: explorer
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "radicle-seed.fullname" . }}-explorer
  labels:
    {{- include "radicle-seed.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "radicle-seed.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: explorer
  template:
    metadata:
      annotations:
        {{- /* config.json is injected with subPath, which kubelet never
               refreshes in place, and it must stay subPath or the ConfigMap
               volume would shadow index.html and the rest of the web root.
               Rolling the pod on change is therefore the only way a config
               edit reaches the browser. */}}
        checksum/config: {{ include (print $.Template.BasePath "/explorer-configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: {{ include "radicle-seed.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: explorer
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: explorer
          image: {{ include "radicle-seed.explorerImage" . | quote }}
          imagePullPolicy: {{ .Values.explorer.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.explorer.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "radicle-seed.fullname" . }}-explorer
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
{{- end }}
